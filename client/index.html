<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      // Immediately unregister any legacy/zombie Service Worker (sw.js) hijacking localhost:5173
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister();
            console.warn('[PulseChat] Purged legacy ServiceWorker:', r);
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var k of keys) caches.delete(k);
        });
      }
      // Defensive Fast Refresh Shim
      if (typeof window !== 'undefined') {
        window.$RefreshReg$ = window.$RefreshReg$ || function() {};
        window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
        if (!window.RefreshRuntime) window.RefreshRuntime = {};
        if (!window.RefreshRuntime.getRefreshReg) {
          window.RefreshRuntime.getRefreshReg = function() { return function() {}; };
        }
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PulseChat - Modern, Multi-Tenant WhatsApp Web Client with Secure Isolated Sessions" />
    <title>PulseChat — Multi-User WhatsApp Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B0E14] text-slate-100 font-sans antialiased overflow-hidden selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
